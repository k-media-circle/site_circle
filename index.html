  <template id="about-details">
    <p class="panel-lead">Медиакружок — горизонтальная исследовательская среда для изучения современного искусства в контексте технологического развития и коллективного творческого поиска.</p>
    <h3>Основные направления деятельности</h3>
    <ol class="details-list"><li><h4>Междисциплинарный синтез</h4><p>Изучаем точки пересечения современного искусства, музыки и технологий: как технологические инструменты трансформируют художественные формы и способы их выражения.</p></li><li><h4>Обмен профессиональным опытом</h4><p>На регулярных офлайн-встречах обсуждаем текущие проекты, разбираем примеры и делимся актуальными находками в области медиа и технологий.</p></li><li><h4>Поддержка творческих практик</h4><p>Создаём неформальную среду для сотворчества и взаимного менторства, помогаем художникам, музыкантам и дизайнерам реализовывать междисциплинарные проекты.</p></li></ol>
    <h3>Возможные направления исследований</h3><p>Среди нас — медиа-артисты, дизайнеры, музыканты, кураторы и другие участники. Наши практики и интересы открывают несколько направлений для совместного поиска:</p>
    <ol class="research-list"><li>Интерактивное и генеративное искусство.</li><li>Алгоритмы и искусственный интеллект в творческих процессах.</li><li>Взаимодействие звука и визуальных медиа в цифровой среде.</li><li>Новые формы перформанса: цифровые, аудиовизуальные и гибридные практики.</li></ol>

памяти, прощении и умении отпускать.Инна Шестакова дополняет барельефы видеомэппингом. С наступлением темноты привычные объекты преображаются: слово «ПРОЩАЙ» вспыхивает белым светом, наполняется тёплыми огненными оттенками и превращается в маленький маяк посреди ночного города.Вдохновением для этой работы стали образы солнца в азиатском кино и аниме. Знакомый момент, когда герой, почти потеряв надежду, поднимает взгляд к свету и находит силы идти дальше. Похожая история есть и в японской мифологии: богиня Аматэрасу выходит из пещеры и возвращает миру солнечный свет.В этой работе свет тоже становится символом надежды. Мерзлота тает, пластилиновые барельефы постепенно исчезают, город меняется. Но даже то, что существует недолго, может оставить после себя что-то светлое.\n\n","src":"","url":"","style":{},"richHTML":"\u003cp>\u003cspan>Иногда, чтобы двигаться дальше, нужно просто сказать «прощай». Алексей Акимов размещает в городе барельефы с этим словом, словно небольшие заплатки на местах утраты. Это попытка поговорить с городом о памяти, прощении и умении отпускать.\u003c/span>\u003c/p>\u003cp>\u003cspan>Инна Шестакова дополняет барельефы видеомэппингом. С наступлением темноты привычные объекты преображаются: слово «ПРОЩАЙ» вспыхивает белым светом, наполняется тёплыми огненными оттенками и превращается в маленький маяк посреди ночного города.\u003c/span>\u003c/p>\u003cp>\u003cspan>Вдохновением для этой работы стали образы солнца в азиатском кино и аниме. Знакомый момент, когда герой, почти потеряв надежду, поднимает взгляд к свету и находит силы идти дальше. Похожая история есть и в японской мифологии: богиня Аматэрасу выходит из пещеры и возвращает миру солнечный свет.\u003c/span>\u003c/p>\u003cp>\u003cspan>В этой работе свет тоже становится символом надежды. Мерзлота тает, пластилиновые барельефы постепенно исчезают, город меняется. Но даже то, что существует недолго, может оставить после себя что-то светлое.\u003c/span>\u003c/p>\n\n\u003cp>\u003c/p>"},{"kind":"ima ":{}},"transition":{"strength":0.75,"blur":1,"chroma":1,"length":1.5,"rotation":1,"backgroundSpeed":18,"edgeSoftness":32},"social":{"telegram":"https://t.me/k_media_circle","instagram":"instagram.com/k_media_circle","email":"hello@media-circle.ru","contactDesignVersion":1,"cvPDFURL":"https://github.com/k-media-circle/site_circle/releases/download/site-downloads/CV-mediakruzhok-ad5ffa32-282b-4e6a-a6c7-8d67e33e5f1c.pdf","cvPDFPath":"","cvPDFName":"медиакружок_CV.pdf"},"aboutText":["сообщество","артистов ","сибири,","которым","интересно","медиаискусство","из"],"aboutComposition":[{"items":["text-0","media-0"],"align":"space-between","gap":0},{"items":["media-3","media-4","media-9","text-1","media-6","text-6"],"align":"space-between","gap":0},{"items":["text-2","media-2","text-3"],"align":"space-between","gap":0},{"items":["media-7","text-4","media-1"],"align":"space-between","gap":0},{"items":["media-8","text-5","media-5","media-10"],"align":"flex-start","gap":0}],"aboutBlocks":[{"kind":"text","text":"Медиакружок - междисциплинарное исследовательское и творческое сообщество, основанное в Красноярске. Оно объединяет художников, дизайнеров, музыкантов, программистов, кураторов, исследователей и всех, кто интересуется современным искусством, медиа и технологиями.","richHTML":"\u003cp>\u003cstrong>Медиакружок\u003c/strong> - междисциплинарное исследовательское и творческое сообщество, основанное в Красноярске. Оно объединяет художников, дизайнеров, музыкантов, программистов, кураторов, исследователей и всех, кто интересуется современным искусством, медиа и технологиями.\u003c/p>","style":{"fontSize":24,"lineHeight":1.28}},{"kind":"text","text":"Мы существуем как открытая среда для исследования, обмена знаниями, художественных экспериментов и коллективного творческого поиска. Изучаем современные художественные практики, обсуждаем их культурный и технологический контекст, осваиваем новые инструменты и исследуем возможности их применения на практике.\nИсследовательская и практическая деятельность существуют в сообществе на равных основаниях. Участники проводят встречи, выступают на конференциях, обмениваются профессиональным опытом, экспериментируют с художественными методами и объединяются для реализации совместных проектов.","src":"","url":"","style":{},"richHTML":"\u003cp>Мы существуем как открытая среда для исследования, обмена знаниями, художественных экспериментов и коллективного творческого поиска. Изучаем современные художественные практики, обсуждаем их культурный и технологический контекст, осваиваем новые инструменты и исследуем возможности их применения на практике.\n\u003c/p>\u003cp>Исследовательская и практическая деятельность существуют в сообществе на равных основаниях. Участники проводят встречи, выступают на конференциях, обмениваются профессиональным опытом, экспериментируют с художественными методами и объединяются для реализации совместных проектов.\u003c/p>"},{"kind":"heading","text":"Основные направления деятельности","richHTML":"\u003ch3>Основные направления деятельности\u003c/h3>","style":{}},{"kind":"text","text":"Исследование и междисциплинарное взаимодействиеИзучение современных художественных практик и процессов, возникающих на пересечении искусства, науки, музыки, дизайна и технологий.Нас интересует, как технологические и культурные изменения влияют на художественный язык, методы создания произведений и способы взаимодействия со зрителем. Исследовательская деятельность включает анализ проектов, обсуждение теоретических подходов и участие в профессиональных дискуссиях и конференциях.Обмен знаниями и профессиональным опытомВстречи сообщества посвящены обсуждению проектов, изучению инструментов, разбору художественных кейсов и обмену практическими знаниями.Каждый участник может предложить тему для обсуждения, представить собственные наработки или инициировать совместное исследование. Обмен опытом строится на принципах открытости, взаимной поддержки и свободного распространения знаний внутри сообщества.Художественные эксперименты и совместные инициативыМедиакружок создаёт условия для сотрудничества художников и специалистов из разных областей. Участники могут объединяться для создания инсталляций, аудиовизуальных перформансов, цифровых произведений и других экспериментальных проектов.Совместная работа возникает по инициативе участников и не является обязательной. Сообщество поддерживает как коллективные, так и индивидуальные художественные практики.\nРазвитие художественной среды СибириМы заинтересованы в исследовании и развитии локальных художественных практик, укреплении профессиональных связей и сотрудничестве.Особое внимание уделяется специфике художественного производства в Сибири: влиянию культурного контекста, технологической инфраструктуры и доступных ресурсов на развитие современного искусства.Медиакружок стремится расширять возможности для профессионального взаимодействия и публичного представления сибирского медиаискусства.","richHTML":"\u003col>\u003cli>\u003ch4>Исследование и междисциплинарное взаимодействие\u003c/h4>Изучение современных художественных практик и процессов, возникающих на пересечении искусства, науки, музыки, дизайна и технологий.\u003cp>Нас интересует, как технологические и культурные изменения влияют на художественный язык, методы создания произведений и способы взаимодействия со зрителем. Исследовательская деятельность включает анализ проектов, обсуждение теоретических подходов и участие в профессиональных дискуссиях и конференциях.\u003c/p>\u003c/li>\u003cli>\u003ch4>Обмен знаниями и профессиональным опытом\u003c/h4>\u003cp>Встречи сообщества посвящены обсуждению проектов, изучению инструментов, разбору художественных кейсов и обмену практическими знаниями.\u003c/p>\u003cp>Каждый участник может предложить тему для обсуждения, представить собственные наработки или инициировать совместное исследование. Обмен опытом строится на принципах открытости, взаимной поддержки и свободного распространения знаний внутри сообщества.\u003c/p>\u003c/li>\u003cli>\u003ch4>Художественные эксперименты и совместные инициативы\u003c/h4>\u003cp>Медиакружок создаёт условия для сотрудничества художников и специалистов из разных областей. Участники могут объединяться для создания инсталляций, аудиовизуальных перформансов, цифровых произведений и других экспериментальных проектов.\u003c/p>\u003cp>Совместная работа возникает по инициативе участников и не является обязательной. Сообщество поддерживает как коллективные, так и индивидуальные художественные практики.\n\u003c/p>\u003c/li>\u003cli>\u003ch4>Развитие художественной среды Сибири\u003c/h4>\u003cp>Мы заинтересованы в исследовании и развитии локальных художественных практик, укреплении профессиональных связей и сотрудничестве.\u003c/p>\u003cp>Особое внимание уделяется специфике художественного производства в Сибири: влиянию культурного контекста, технологической инфраструктуры и доступных ресурсов на развитие современного искусства.\u003c/p>\u003cp>Медиакружок стремится расширять возможности для профессионального взаимодействия и публичного представления сибирского медиаискусства.\u003c/p>\u003c/li>\u003c/ol>","style":{}},{"kind":"heading","text":"Области исследовательских и творческих интересов","richHTML":"\u003ch2>Области исследовательских и творческих интересов\u003c/h2>","style":{}},{"kind":"text","text":"Интерактивное и генеративное искусство. Алгоритмические и процедурные методы, интерактивные инсталляции, генеративные системы и программируемые художественные среды.Звук и визуальные медиа. Аудиовизуальное искусство, экспериментальная электронная музыка, звуковые инсталляции, аудиореактивные системы и взаимодействие звука, изображения и пространства.Перформативные и гибридные практики. Аудиовизуальные выступления, лайв-кодинг, цифровой перформанс, импровизация и экспериментальные формы взаимодействия исполнителя, технологий и зрителя.Цифровые и интерактивные среды. Веб-арт, виртуальные и смешанные пространства, интерактивные интерфейсы и экспериментальные формы цифрового взаимодействия.","richHTML":"\u003col>\u003cli>\u003cp>\u003cstrong>Интерактивное и генеративное искусство.\u003c/strong> Алгоритмические и процедурные методы, интерактивные инсталляции, генеративные системы и программируемые художественные среды.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Звук и визуальные медиа.\u003c/strong> Аудиовизуальное искусство, экспериментальная электронная музыка, звуковые инсталляции, аудиореактивные системы и взаимодействие звука, изображения и пространства.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Перформативные и гибридные практики.\u003c/strong> Аудиовизуальные выступления, лайв-кодинг, цифровой перформанс, импровизация и экспериментальные формы взаимодействия исполнителя, технологий и зрителя.\u003c/p>\u003c/li>\u003cli>\u003cp>\u003cstrong>Цифровые и интерактивные среды.\u003c/strong> Веб-арт, виртуальные и смешанные пространства, интерактивные интерфейсы и экспериментальные формы цифрового взаимодействия.\u003c/p>\u003c/li>\u003c/ol>","style":{}}],"cvBlocks":[{"kind":"text","text":"Год основания: 2026Основная локализация: г. Красноярск \u2028\nКуратор - Инна Шестакова\u2028\u2028 Векторы исследований:Интерактивное и генеративное искусствоИспользование алгоритмов и искусственного интеллекта в творческих процессахВзаимодействие звука и визуальных медиа в цифровой средеНовые формы цифрового перфомансаСообщество является исследовательской средой, направленной на изучение актуальных состояний современного искусства в контексте технологического развития и создание пространства для коллективного творческого поискаСайт: media-circle.ruПочта: hello@media-circle.ruТг-канал: t.me/k_media_circle\n","src":"","url":"","style":{"color":"#e9e9e1"},"richHTML":"Год основания: 2026\u003cbr>\u003cdiv>Основная локализация: г. Красноярск \u2028\nКуратор - Инна Шестакова\u2028\u2028&nbsp;\u003c/div>\u003ch3>\u003cfont style=\"color: rgb(200, 236, 1);\">Векторы исследований:\u003c/font>\u003c/h3>\u003col>\u003cli>Интерактивное и генеративное искусство\u003c/li>\u003cli>Использование алгоритмов и искусственного интеллекта в творческих процессах\u003c/li>\u003cli>Взаимодействие звука и визуальных медиа в цифровой среде\u003c/li>\u003cli>Новые формы цифрового перфоманса\u003c/li>\u003c/ol>\u003cdiv>Сообщество является исследовательской средой, направленной на изучение актуальных состояний современного искусства в контексте технологического развития и создание пространства для коллективного творческого поиска\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>Сайт: \u003ca href=\"https://media-circle.ru\" target=\"_blank\" rel=\"noopener noreferrer\">media-circle.ru\u003c/a>\u003c/div>Почта: hello@media-circle.ru\u003cbr>Тг-канал: \u003ca href=\"https://t.me/k_media_circle\" target=\"_blank\" rel=\"noopener noreferrer\">t.me/k_media_circle\u003c/a>\u003cbr>\u003cbr>\n","mobileStyle":{"color":"#e9e9e1"}},{"kind":"heading","text":"Collective Statement / Манифест сообщества","src":"","url":"","style":{},"richHTML":"\u003ch2>\u003cfont style=\"color: rgb(200, 236, 1);\">Collective Statement / Манифест сообщества\u003c/font>\u003c/h2>\u003ch2>\u003c/h2>","mobileStyle":{}},{"kind":"text","text":"Наше сообщество — это междисциплинарная исследовательская среда, сосредоточенная на поиске точек пересечения современного искусства, музыки и передовых технологий. Мы рассматриваем технологические инструменты не просто как средства выражения, но как катализаторы трансформации художественных форм.В центре нашего внимания — изучение интерактивного и генеративного искусства, внедрение алгоритмов и искусственного интеллекта в творческий процесс, а также исследование синестезии звука и визуальных медиа в цифровой среде. Мы стремимся к осмыслению новых форм цифрового перформанса, превращая технологический поиск в глубокую художественную практику.Действуя через систему регулярного профессионального обмена и практической рефлексии, мы создаем пространство для сотворчества и взаимного менторства. Наше сообщество объединяет художников, музыкантов и дизайнеров, поддерживая междисциплинарные проекты и формируя живой диалог между технологическим прогрессом и эстетическим опытом.\n\n","src":"","url":"","style":{},"richHTML":"\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>Наше сообщество — это междисциплинарная исследовательская среда, сосредоточенная на поиске точек пересечения современного искусства, музыки и передовых технологий. Мы рассматриваем технологические инструменты не просто как средства выражения, но как катализаторы трансформации художественных форм.\u003c/span>\u003cbr>\u003cbr>\u003cspan>В центре нашего внимания — изучение интерактивного и генеративного искусства, внедрение алгоритмов и искусственного интеллекта в творческий процесс, а также исследование синестезии звука и визуальных медиа в цифровой среде. Мы стремимся к осмыслению новых форм цифрового перформанса, превращая технологический поиск в глубокую художественную практику.\u003c/span>\u003cbr>\u003cbr>\u003cspan>Действуя через систему регулярного профессионального обмена и практической рефлексии, мы создаем пространство для сотворчества и взаимного менторства. Наше сообщество объединяет художников, музыкантов и дизайнеров, поддерживая междисциплинарные проекты и формируя живой диалог между технологическим прогрессом и эстетическим опытом.\u003c/span>\n\n","mobileStyle":{}},{"kind":"heading","text":"Проекты сообщества\n\n","src":"","url":"","style":{},"richHTML":"\u003ch2>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cfont style=\"color: rgb(200, 236, 1);\">\u003cspan>Проекты сообщества\u003c/span>\u003c/font>\u003c/h2>\n\n\u003ch3>\u003c/h3>","mobileStyle":{}},{"kind":"text","text":"2026 - Аудиовизуальный перформанс «Ангарида: место, где тебе рады» в рамках публичной программы выставки «АНГАРИДА “КОНТИНЕНТ СИБИРИЯ”», Красноярский центр культурных инициатив, г. Красноярск2026 - Мэппинг работа «Пустоту заполнит прощение: Свет во тьме» в рамках проекта «Невечная мерзлота», г. Иркутск\u20282026 - Лайвкодинг перформанс, hi-fi-бар «Francis Club», г. Красноярск\u20282026 - Видеоарт «Карст» в рамках музейной ночи «Врата в подземелье»,  Музей геологии Центральной Сибири, г. Красноярск\n\n","src":"","url":"","style":{},"richHTML":"\u003cul>\u003cli>\u003cspan>2026 - Аудиовизуальный перформанс «Ангарида: место, где тебе рады» в рамках публичной программы выставки «АНГАРИДА “КОНТИНЕНТ СИБИРИЯ”», Красноярский центр культурных инициатив, г. Красноярск\u003c/span>\u003c/li>\u003c/ul>\u003cul>\u003cli>\u003cspan>2026 - Мэппинг работа «Пустоту заполнит прощение: Свет во тьме»&nbsp;\u003c/span>\u003cspan>в рамках проекта «Невечная мерзлота», г. Иркутск\u2028\u003c/span>\u003c/li>\u003c/ul>\u003cul>\u003cli>\u003cspan>2026 - Лайвкодинг перформанс, hi-fi-бар «Francis Club», г. Красноярск\u2028\u003c/span>\u003c/li>\u003c/ul>\u003cul>\u003cli>\u003cspan>2026 - Видеоарт «Карст» в рамках музейной ночи «Врата в подземелье», \u003c/span>\u003cspan>&nbsp;Музей геологии Центральной Сибири, г. Красноярск\u003c/span>\n\n\u003c/li>\u003c/ul>\u003cp>\u003c/p>","mobileStyle":{}},{"kind":"heading","text":"Избранные проекты","src":"","url":"","style":{},"richHTML":"\u003ch2>\u003cfont style=\"color: rgb(200, 236, 1);\">Избранные проекты\u003c/font>\u003c/h2>\u003ch2>\u003c/h2>","mobileStyle":{}},{"kind":"text","text":"Livecoding \nПерформанс / 2026 Авторы: Инна Шестакова, Алексей Акимов\nОписание: Перформанс представляет собой междисциплинарную практику генеративного искусства. Вместо воспроизведения пре-рендеренного контента авторы используют метод лайв-кодинга, где музыка и визуал формируются синхронно в процессе исполнения. Процесс алгоритмического синтеза открыт для зрителя, превращая технический инструментарий  в пространство для наблюдения за динамикой цифрового перформанса.\nКарстВидеоарт / 2026 Автор: Инна ШестаковаОписание: В основе видеоработы лежат фото форм и текстур карстовых образований из коллекции музея геологии, преобразованные средствами генеративной графики. Природные структуры растворяются в цифровой среде, превращаясь в абстрактный поток рельефов, линий и пластических трансформаций. Работа соединяет геологическую материю и алгоритмическую форму, создавая пространство между природным и цифровым.\nПустоту заполнит прощение:  Свет во тьмеМэппинг / 2026 Авторы: Инна Шестакова, Алексей АкимовОписание: Алексей Акимов разместил барельефы со словом «ПРОЩАЙ». Это акт символического лечения города: прощение становится заплаткой на месте утраты. Инна Шестакова добавляет к этим объектам слой видеомэппинга, и в темноте городской ночи барельефы преображаются: луч света превращает их в маяки. Слово «ПРОЩАЙ» то вспыхивает ослепительно белым, то окрашивается тёплыми огненными тонами — прощение и прощание перестают становится источником света и надежды. Этот визуальный язык отсылает к тропу Cue the Sun из азиатского кино и аниме — моменту, когда герой на грани отчаяния поднимает взгляд к солнцу и обретает силы бороться до конца. В китайской традиции солнце — устойчивый символ надежды, в японской мифологии свет несёт сама Аматэрасу, богиня солнца, которая, покинув тёмную пещеру, вернула миру день. Миф об Аматэрасу — та же метафора, что и в проекте: свет выманивает из тьмы и заполняет пустоту.  Мерзлота тает, форма из пластилина недолговечна, но свет, рождённый актом прощения, остаётся.","src":"","url":"","style":{},"richHTML":"\u003ch3>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003cfont style=\"color: rgb(200, 236, 1);\">Livecoding \u003c/font>\u003c/span>\u003c/h3>\n\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>Перформанс / 2026&nbsp;\u003c/span>\u003cdiv>\u003cspan>Авторы: Инна Шестакова, Алексей Акимов\u003c/span>\u003c/div>\u003cdiv>\u003cspan>\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan>\u003cspan data-doc-element=\"element-mvmftsy8-fmcgg\">\u003c/span>\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan>\u003cbr>\u003c/span>\u003c/div>\n\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>Описание: \u003c/span>\ ие становится заплаткой на месте утраты. Инна Шестакова добавляет к этим объектам слой видеомэппинга, и в темноте городской ночи барельефы преображаются: луч света превращает их в маяки. Слово «ПРОЩАЙ» то вспыхивает ослепительно белым, то окрашивается тёплыми огненными тонами — прощение и прощание перестают становится источником света и надежды.&nbsp;\u003c/div>\u003cdiv>Этот визуальный язык отсылает к тропу Cue the Sun из азиатского кино и аниме — моменту, когда герой на грани отчаяния поднимает взгляд к солнцу и обретает силы бороться до конца. В китайской традиции солнце — устойчивый символ надежды, в японской мифологии свет несёт сама Аматэрасу, богиня солнца, которая, покинув тёмную пещеру, вернула миру день. Миф об Аматэрасу — та же метафора, что и в проекте: свет выманивает из тьмы и заполняет пустоту.&nbsp; Мерзлота тает, форма из пластилина недолговечна, но свет, рождённый актом прощения, остаётся.\u003cbr>\u003cbr>\u003c/div>\u003cp>\u003c/p>","elements":[{"width":584,"height":335,"gap":4,"flow":"inline","kind":"image","src":"http://media-circle.ru/media/798b4875bb26fada2be604d0e8be1e77c0f671b8.png","alt":"","id":"element-mvmftsy8-fmcgg","preview":{"source":"http://media-circle.ru/media/798b4875bb26fada2be604d0e8be1e77c0f671b8.png","src":"https://media-circle.ru/media/ac9e3af2478ac7a73e1db3d07bb12ab6b31b24bb.webp","width":1600,"height":900,"mobile":{"src":"https://media-circle.ru/media/85f6ac216643678fdd6a63be20f5bc8be91ddccb.webp","width":800,"height":450}}},{"width":293,"height":371,"gap":4,"flow":"inline","kind":"image","src":"http://media-circle.ru/media/435ff712d1a5e1635b4aad278bf1ae670368d1e9.jpg","alt":"","id":"element-mvmfvt32-oe1z3","preview":{"source":"http://media-circle.ru/media/435ff712d1a5e1635b4aad278bf1ae670368d1e9.jpg","src":"https://media-circle.ru/media/e970d4ba64c2a15733ed341784339b1d8696744a.webp","width":1024,"height":1280,"mobile":{"src":"https://media-circle.ru/media/ab5833525d1489b085fdea7a957321620e4035d1.webp","width":800,"height
